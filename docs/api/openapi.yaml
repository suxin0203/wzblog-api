          content:
            text/event-stream:
              schema:
                type: string
              example: 'event: session

                data: {"sessionId":"01JC8Z3K7Q9V2M4T6B8X0D1F2G","sessionToken":null,"expiresAt":null}


                event: tool

                data: {"name":"search_articles","brief":"按关键词检索站内已公开文章","status":"start","params":{"keyword":"虚拟线程"}}


                event: tool

                data: {"name":"search_articles","brief":"按关键词检索站内已公开文章","status":"end","resultCount":3}


                event: delta

                data: {"text":"Java 21 的虚拟线程适合大量阻塞 IO，"}


                event: done

                data: {"messageId":"1839028172639400001","usage":{"promptTokens":812,"completionTokens":236},"finishReason":"stop"}'
