      description: 未登录或凭证无效。code=AUTH_UNAUTHORIZED / AUTH_TOKEN_INVALID / AUTH_TOKEN_EXPIRED / AUTH_REFRESH_INVALID
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Error403:
      description: 无权限/账号停用/游客功能关闭。code=AUTH_FORBIDDEN / AUTH_ACCOUNT_DISABLED 等
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
