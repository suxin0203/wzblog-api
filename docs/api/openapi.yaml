  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: accessToken（15 分钟）；过期用 POST /auth/refresh 轮换
  schemas:
    UpdateProfileRequest:
      type: object
      properties:
        nickname:
          type: string
          maxLength: 30
          minLength: 0
        bio:
          type: string
          maxLength: 255
          minLength: 0
        avatarKey:
          type: string
          maxLength: 255
          minLength: 0
      required:
      - nickname
    ResultUserSelfVO:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          $ref: '#/components/schemas/UserSelfVO'
        traceId:
          type: string
      description: 统一响应壳：code=OK 表示成功；失败时 data=null（仅参数校验失败时 data.errors={字段:原因}）；traceId 贯穿日志
    TitleBriefVO:
      type: object
      properties:
        id:
          type: string
          description: 线上为字符串（docs/04 §1.3 BIGINT ID 一律字符串）
        name:
          type: string
        cssClass:
          type: string
    UserSelfVO:
      type: object
      properties:
        id:
          type: string
          description: 线上为字符串（docs/04 §1.3 BIGINT ID 一律字符串）
        username:
          type: string
        nickname:
          type: string
        email:
          type: string
        emailVerified:
          type: boolean
        avatarUrl:
          type: string
        bio:
          type: string
        role:
          type: string
        status:
          type: string
        activeTitle:
          $ref: '#/components/schemas/TitleBriefVO'
        lastLoginAt:
          type: string
          format: date-time
        createdAt:
          type: string
          format: date-time
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword:
          type: string
          minLength: 1
        newPassword:
          type: string
          minLength: 1
          pattern: ^(?=.*[A-Za-z])(?=.*[0-9])[\x21-\x7E]{8,64}$
      required:
      - newPassword
      - oldPassword
    ResultVoid:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data: {}
        traceId:
          type: string
      description: 统一响应壳：code=OK 表示成功；失败时 data=null（仅参数校验失败时 data.errors={字段:原因}）；traceId 贯穿日志
    ArticleUpdateRequest:
      type: object
      properties:
        title:
          type: string
          maxLength: 150
          minLength: 0
        slug:
          type: string
          maxLength: 180
          minLength: 3
          pattern: ^[a-z0-9]+(?:-[a-z0-9]+)*$
        summary:
          type: string
          maxLength: 300
          minLength: 0
        coverKey:
          type: string
          maxLength: 255
          minLength: 0
        contentMd:
          type: string
          minLength: 1
        categoryId:
          type: string
        tagIds:
          type: array
          items:
            type: string
          maxItems: 10
          minItems: 0
        visibility:
          type: string
          enum:
          - PUBLIC
          - PRIVATE
          - UNLISTED
          description: 文章可见性
        allowComment:
          type: boolean
        version:
          type: integer
          format: int32
          minimum: 0
          description: 乐观锁版本号：更新文章必须回传最新值，冲突返回 409 ARTICLE_VERSION_CONFLICT
