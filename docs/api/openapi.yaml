paths:
  /actuator/health:
    get:
      tags:
      - platform
      summary: 健康检查
      description: 基础设施路由（不带 /api/v1 前缀，契约 P02）。公开
      operationId: health
      responses:
        '200':
          description: UP/ DOWN
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
      security: []
  /actuator/info:
    get:
      tags:
      - platform
      summary: 构建信息
      description: 基础设施路由（不带 /api/v1 前缀，契约 P03）。公开
      operationId: actuatorInfo
      responses:
        '200':
          description: 构建信息 JSON
      security: []
  /actuator/prometheus:
    get:
      tags:
      - platform
      summary: Prometheus 指标抓取
      description: 基础设施路由（不带 /api/v1 前缀，契约 P04）。ADMIN 或内网访问
      operationId: prometheusMetrics
      responses:
        '200':
          description: text/plain 指标文本
          content:
            text/plain:
              schema:
                type: string
      security:
      - bearerAuth: []
  /api/v1/ping:
    get:
      tags:
      - platform
      operationId: ping
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultMapStringObject'
        '400':
          $ref: '#/components/responses/Error400'
      summary: 存活探针
      description: 契约 P01 ｜ 模块 M0 ｜ 权限 PUBLIC ｜ 幂等：天然
      security: []
  /api/v1/auth/captcha:
    get:
      tags:
      - auth
      operationId: getCaptcha
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultCaptchaVO'
        '400':
          $ref: '#/components/responses/Error400'
        '429':
          $ref: '#/components/responses/Error429'
      summary: 图形验证码，5 分钟
      description: 契约 R001 ｜ 模块 M1 ｜ 权限 PUBLIC ｜ 幂等：天然
      security: []
  /api/v1/auth/login:
    post:
      tags:
      - auth
      operationId: doAuthLogin
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultTokenPairVO'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
      summary: 登录，返回双 Token
      description: 契约 R003 ｜ 模块 M1 ｜ 权限 PUBLIC ｜ 幂等：否 ｜ 返回体不含用户对象，资料另调 GET /users/me；连续 5 次密码错误锁定 15 分钟（429 AUTH_ACCOUNT_LOCKED）
      security: []
  /api/v1/auth/logout:
    post:
      tags:
      - auth
      operationId: logout
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LogoutRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
      summary: 吊销当前 family
      description: 契约 R005 ｜ 模块 M1 ｜ 权限 USER ｜ 幂等：是
      security:
      - bearerAuth: []
  /api/v1/auth/logout-all:
    post:
      tags:
      - auth
      operationId: logoutAll
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
          $ref: '#/components/responses/Error403'
        '409':
          $ref: '#/components/responses/Error409'
      summary: 吊销全部 family
      description: 契约 R006 ｜ 模块 M1 ｜ 权限 USER ｜ 幂等：是
      security:
      - bearerAuth: []
  /api/v1/auth/password/forgot/request:
    post:
      tags:
      - auth
      operationId: requestPasswordReset
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultForgotSentVO'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
      summary: 发送重置码（不泄露存在性）
      description: 契约 R007 ｜ 模块 M1 ｜ 权限 PUBLIC ｜ 幂等：是
      security: []
  /api/v1/auth/password/forgot/reset:
    post:
      tags:
      - auth
      operationId: resetPassword
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotResetRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultVoid'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
      summary: 重置密码并全端下线
      description: 契约 R009 ｜ 模块 M1 ｜ 权限 PUBLIC ｜ 幂等：一次性
      security: []
  /api/v1/auth/password/forgot/verify:
    post:
      tags:
      - auth
      operationId: verifyPasswordResetCode
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ForgotVerifyRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultResetTokenVO'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
      summary: 校验码换 resetToken
      description: 契约 R008 ｜ 模块 M1 ｜ 权限 PUBLIC ｜ 幂等：否
      security: []
  /api/v1/auth/qr/sessions:
    post:
      tags:
      - auth
      summary: 【待实现】创建 PC 扫码会话（成功 200，v1.6.1 裁决）
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。无请求体字段
      operationId: createQrSession
      x-status: pending
      responses:
        '200':
          description: sceneId + status=PENDING + expiresAt（成功 200，v1.6.1 裁决）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQrSessionVO'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties: {}
  /api/v1/auth/qr/sessions/{sceneId}:
    get:
      tags:
      - auth
      summary: 【待实现】轮询扫码状态（CONFIRMED 带 ticket）
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。
      operationId: getQrSessionStatus
      x-status: pending
      responses:
        '200':
          description: 仅 CONFIRMED 返回 ticket（不消费）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQrStatusVO'
      parameters:
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
  /api/v1/auth/qr/sessions/{sceneId}/bind-and-confirm:
    post:
      tags:
      - auth
      summary: 【待实现】登录态绑定并确认（Authorization 必带）
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。
      operationId: qrBindAndConfirm
      x-status: pending
      responses:
        '200':
          description: bindToken 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQrConfirmVO'
      parameters:
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bindToken
              properties:
                bindToken:
                  type: string
  /api/v1/auth/qr/sessions/{sceneId}/code:
    get:
      tags:
      - auth
      summary: 【待实现】小程序码 PNG（二进制例外，不套响应壳）
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。
      operationId: getQrSessionCode
      x-status: pending
      responses:
        '200':
          description: image/png 裸字节；失败仍返回 JSON 错误体
          content:
            image/png:
              schema:
                type: string
                format: binary
      parameters:
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
  /api/v1/auth/qr/sessions/{sceneId}/confirm:
    post:
      tags:
      - auth
      summary: 【待实现】小程序已登录用户确认，下发一次性 bindToken(60s)
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。
      operationId: confirmQrSession
      x-status: pending
      responses:
        '200':
          description: 仅 confirm 下发 bindToken
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQrConfirmVO'
      security:
      - bearerAuth: []
      parameters:
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                bindToken:
                  type: string
                  description: 43 位 Base64URL；仅无小程序登录态时必须
                userInfo:
                  type: object
                  properties:
                    nickname:
                      type: string
                    avatarKey:
                      type: string
  /api/v1/auth/qr/sessions/{sceneId}/register-and-confirm:
    post:
      tags:
      - auth
      summary: 【待实现】注册新账号并确认
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。
      operationId: qrRegisterAndConfirm
      x-status: pending
      responses:
        '200':
          description: bindToken 为 null
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingQrConfirmVO'
      parameters:
      - name: sceneId
        in: path
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - bindToken
              - username
              - password
              properties:
                bindToken:
                  type: string
                username:
                  type: string
                  pattern: ^[A-Za-z0-9_]{4,20}$
                password:
                  type: string
                  description: 8~64 位可见 ASCII，含字母与数字
                nickname:
                  type: string
  /api/v1/auth/qr/tickets/exchange:
    post:
      tags:
      - auth
      summary: 【待实现】一次性 ticket 换双 Token（PC 端唯一取 Token 入口）
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。
      operationId: exchangeQrTicket
      x-status: pending
      responses:
        '200':
          description: TokenPair + user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingWechatTokenPairVO'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - ticket
              properties:
                ticket:
                  type: string
  /api/v1/auth/refresh:
    post:
      tags:
      - auth
      operationId: refreshToken
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultTokenPairVO'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
      summary: 刷新并轮换（10 秒宽限）
      description: 契约 R004 ｜ 模块 M1 ｜ 权限 PUBLIC ｜ 幂等：轮换 ｜ refresh 轮换制：每次返回新 token 对，旧 refresh 作废；复用已作废 refresh（401
        AUTH_REFRESH_REUSED）触发全家簇吊销
      security: []
  /api/v1/auth/register:
    post:
      tags:
      - auth
      operationId: createAuthRegister
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserSelfVO'
        '400':
          $ref: '#/components/responses/Error400'
        '409':
          $ref: '#/components/responses/Error409'
        '429':
          $ref: '#/components/responses/Error429'
      summary: 注册（不自动登录、不发 token）
      description: 契约 R002 ｜ 模块 M1 ｜ 权限 PUBLIC ｜ 幂等：否 ｜ 注册成功不自动登录、不发 token；前端应引导去登录页
      security: []
  /api/v1/auth/wechat/bind:
    post:
      tags:
      - auth
      summary: 【待实现】已登录用户绑定微信 openid
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。
      operationId: bindWechat
      x-status: pending
      responses:
        '200':
          description: bound + user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingWechatBindVO'
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
  /api/v1/auth/wechat/login:
    post:
      tags:
      - auth
      summary: 【待实现】小程序 code 登录（返回双 Token + user）
      description: 契约 R139~R147（docs/modules/M8-wechat.md）已定稿但后端尚未实现；上线前勿对接。当前由旧协议兼容层（/qr-login/*、/miniapp/*、/wechat/*）承载同类场景。
      operationId: wechatLogin
      x-status: pending
      responses:
        '200':
          description: TokenPair + user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PendingWechatTokenPairVO'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - code
              properties:
                code:
                  type: string
                  maxLength: 128
                  description: wx.login() 获取的 code，一次性
                nickname:
                  type: string
                  description: 1~30，可选
                avatarKey:
                  type: string
                  maxLength: 255
  /api/v1/users/me:
    get:
      tags:
      - users
      operationId: getMyProfile
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResultUserSelfVO'
        '400':
          $ref: '#/components/responses/Error400'
        '401':
          $ref: '#/components/responses/Error401'
        '403':
