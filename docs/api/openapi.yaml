openapi: 3.0.3
info:
  title: 文栈博客 API
  version: 1.6.3
  description: '文栈博客后端接口契约（契约版本 1.6.2 定稿版，与 docs/04-接口契约.md 对齐）。


    **契约状态**：v1.6.2 **冻结版**（2026-10-29）。v1.6.1 裁决的成功统一 200 与 offset 分页校验已由后端整改（commit aadc98b）并经契约管家 19 项独立复测全部通过；路由
    155 条全覆盖、公共 DTO 逐字段比对一致、NotificationType 13 枚举对齐、错误码语义全对。遗留 2 项低优先级待裁决（看板 days 口径、banner 缺 imageKey 返 500），见《接口对接文档.md》附录
    B，不影响前端对接。冻结后字段级变更走契约变更流程：先改 docs/00 → docs/04 → 重建本契约并登记附录 C。


    **全局约定**：

    - 统一前缀 `/api/v1`（例外：旧协议兼容路由与媒体路由，见 legacy-*/media 标签）

    - 响应壳 `{code, message, data, traceId}`：code 为字符串，成功固定 `OK`（HTTP 200；v1.6.1 裁决创建/动作成功统一 200，废除 201）；失败 data=null；参数校验失败
    data={"errors":{字段:原因}}

    - 鉴权：`Authorization: Bearer <accessToken>`（JWT，15 分钟）；refresh 轮换制（14 天）；游客 AI 会话用 `X-AI-Session-Token`

    - ID 一律字符串（"1024"）；时间 ISO-8601 UTC（2026-10-24T06:00:00Z）；列表永不为 null；金额/积分/计数为整数

    - 偏移分页 `page/pageSize`（默认 20，最大 100）→ PageResult；游标分页 `cursor/size`（默认 20，最大 50）→ CursorPage

    - 下单必带 `Idempotency-Key` 头；文章更新带 `version` 乐观锁；限流响应带 `Retry-After`

    - SSE 用 fetch + ReadableStream 带 Authorization，禁用 EventSource

    - 每个响应带 `X-Trace-Id` 头


    **错误码目录**（105 个，全量见《接口对接文档.md》附录）：同一 code 只绑一个 HTTP；前缀 COMMON_/AUTH_/USER_/ARTICLE_/CATEGORY_/TAG_/COMMENT_/REACTION_/GUESTBOOK_/NOTIFY_/POINTS_/GOODS_/TITLE_/ORDER_/FILE_/AI_/WECHAT_。


    **实现状态**：标注【待实现】的接口（x-status: pending）为 M8 微信新契约，尚未编码；旧协议兼容路由仅供已上线小程序使用。本契约由契约管家从 Controller 代码 + 运行态 /v3/api-docs
    + 实测样例逆向生成，构建工具 tools/contract/build_contract.py。'
