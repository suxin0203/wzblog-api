      description: 资源不存在或不可见（不泄露存在性）。code=*_NOT_FOUND
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Error409:
      description: 唯一冲突/状态不允许/幂等键冲突/乐观锁冲突。code=*_CONFLICT / *_STATE_INVALID 等
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Error410:
      description: 凭证已过期。code=*_EXPIRED
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Error429:
      description: 限流（响应头带 Retry-After 秒）。code=COMMON_RATE_LIMITED / AI_QUOTA_EXCEEDED 等
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Error500:
      description: 服务器内部错误。code=COMMON_INTERNAL_ERROR
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Error502:
      description: 上游服务错误。code=AI_UPSTREAM_ERROR / WECHAT_API_ERROR 等
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
    Error503:
      description: 功能关闭/服务不可用。code=AI_DISABLED / WECHAT_NOT_ENABLED 等
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ResultVoid'
