# CI 三段：build（编译）→ test（Testcontainers 集成测试）→ package（打包并归档 jar）。
# ubuntu-latest 自带 Docker，Testcontainers 可直接跑 MySQL/Redis 真容器。
name: ci

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B -ntp compile

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    # 失败诊断分支回写需要 contents:write（仅 test job 持有）
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test (Testcontainers + ArchUnit + JaCoCo)
        # 输出落盘供失败诊断（CI 日志对协作者可见；摘要额外写入 Job Summary 匿名可读）
        run: set -o pipefail; mvn -B -ntp verify 2>&1 | tee /tmp/mvn-verify.log
        env:
          WZBLOG_TESTCONTAINERS: "1"
      - name: Failure digest
        if: failure()
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.run_id }}
        # 失败证据持久化到 ci-diagnostics 分支（公开分支，匿名 git fetch 可读），
        # 同时逐行 ::error:: 生成注解（前 10 条，注解 API 匿名可读）
        run: |
          {
            echo "## 失败测试清单"
            grep -E "<<< (FAILURE|ERROR)!" /tmp/mvn-verify.log | head -60 || echo "（无单测级失败标记）"
            echo "## 汇总统计"
            grep -E "Tests run: [0-9]+, Failures" /tmp/mvn-verify.log | tail -6 || true
            echo "## 覆盖率 / 规则"
            grep -iE "coverage|rule violated|jacoco" /tmp/mvn-verify.log | head -20 || echo "（无覆盖率违规行）"
            echo "## run id"
            echo "$RUN_ID"
          } > /tmp/failure-digest.md
          grep -E "<<< (FAILURE|ERROR)!" /tmp/mvn-verify.log | head -10 | while IFS= read -r line; do
            echo "::error::${line:0:300}"
          done
          git config --global user.name "wzblog-ci-bot"
          git config --global user.email "ci-bot@wzblog.local"
          git clone --depth 1 --branch ci-diagnostics             "https://x-access-token:${GH_TOKEN}@github.com/suxin0203/wzblog-api.git" /tmp/diag             || { mkdir -p /tmp/diag && cd /tmp/diag && git init -b ci-diagnostics                  && git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/suxin0203/wzblog-api.git"; }
          cp /tmp/failure-digest.md /tmp/diag/
          cp /tmp/mvn-verify.log /tmp/diag/verify-full.log
          cd /tmp/diag
          git add -A
          git commit -m "ci failure evidence (run $RUN_ID)" || echo "无变化"
          git push origin ci-diagnostics
      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B -ntp package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wzblog-server-jar
          path: target/wzblog-server-*.jar
          retention-days: 7
