# CI 三段：build（编译）→ test（Testcontainers 集成测试）→ package（打包并归档 jar）。
# ubuntu-latest 自带 Docker，Testcontainers 可直接跑 MySQL/Redis 真容器。
name: ci

on:
  push:
    branches: [master, "feat/**"]
  pull_request:
    branches: [master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Compile
        run: mvn -B -ntp compile

  test:
    runs-on: ubuntu-latest
    needs: build
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Test (Testcontainers + ArchUnit + JaCoCo)
        # 输出落盘供失败诊断（CI 日志对协作者可见；摘要额外写入 Job Summary 匿名可读）
        run: set -o pipefail; mvn -B -ntp verify 2>&1 | tee /tmp/mvn-verify.log
        env:
          WZBLOG_TESTCONTAINERS: "1"
      - name: Failure digest
        if: failure()
        run: |
          {
            echo "## 测试失败摘要"
            echo '```'
            grep -E "Tests run:.*(Failures: [1-9]|Errors: [1-9])|<<< (FAILURE|ERROR)!|Coverage|coverage.*[0-9]+\.[0-9]+%|Rule violated|jacoco" /tmp/mvn-verify.log | head -60 || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY" || true
      - name: Upload coverage to Codecov
        if: always()
        continue-on-error: true
        uses: codecov/codecov-action@v5
        with:
          files: target/site/jacoco/jacoco.xml
          fail_ci_if_error: false
      - name: Upload coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jacoco-report
          path: target/site/jacoco/
          retention-days: 7
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
          retention-days: 7

  package:
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Package
        run: mvn -B -ntp package -DskipTests
      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: wzblog-server-jar
          path: target/wzblog-server-*.jar
          retention-days: 7
