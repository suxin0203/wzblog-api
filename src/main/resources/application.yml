server:
  port: ${SERVER_PORT:8021}
  shutdown: graceful
  tomcat:
    # 拒绝超大 multipart 时仍读完整请求体再回错误（默认 2MB 会直接掐连接，客户端拿不到 4xx JSON）
    max-swallow-size: 8MB

spring:
  application:
    name: wzblog
  config:
    import: optional:file:./.env[.properties]
  lifecycle:
    timeout-per-shutdown-phase: 20s
  datasource:
    url: "jdbc:mysql://${DB_HOST:127.0.0.1}:${DB_PORT:3306}/${DB_NAME:wzblog}?useUnicode=true&characterEncoding=utf8&serverTimezone=UTC&useSSL=false&allowPublicKeyRetrieval=true"
    username: ${DB_USER}
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 20
      minimum-idle: 5
      connection-timeout: 3000
      validation-timeout: 3000
  data:
    redis:
      host: ${REDIS_HOST:127.0.0.1}
      port: ${REDIS_PORT:6379}
      database: ${REDIS_DATABASE:1}
      password: ${REDIS_PASSWORD:}
      timeout: 2s
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false
  jackson:
    time-zone: UTC
    serialization:
      write-dates-as-timestamps: false
  mvc:
    throw-exception-if-no-handler-found: true
  servlet:
    multipart:
      # 与 wzblog.file.max-size-bytes(5MB) 对齐；Boot 默认 1MB 会把 1~5MB 上传打成 500
      max-file-size: 5MB
      max-request-size: 6MB
  web:
    resources:
      add-mappings: true
#  main:
#    banner-mode: off
  task:
    scheduling:
      pool:
        size: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: com.baomidou.mybatisplus.core.handlers.MybatisEnumTypeHandler
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false
    db-config:
      id-type: auto

management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: when_authorized

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    root: INFO
    com.wzblog: INFO
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%X{traceId:-}] %logger{40} - %msg%n"

wzblog:
  file:
    storage: ${FILE_STORAGE:local}
    root: ${FILE_STORAGE_ROOT:./data/uploads}
    public-base-url: ${FILE_PUBLIC_BASE_URL:http://localhost:8021/media}
    upload-base-url: ${FILE_UPLOAD_BASE_URL:http://localhost:8021}
    url-secret: ${WZBLOG_FILE_URL_SECRET:${JWT_SECRET}}
  auth:
    jwt-secret: ${JWT_SECRET}
    issuer: wzblog
    audience: wzblog-web
    access-ttl: 15m
    refresh-ttl: 14d
    refresh-grace: 10s
    captcha-enabled: ${WZBLOG_CAPTCHA_ENABLED:true}
    captcha-ttl: 5m
    captcha-max-fails: 3
    login-max-failures: 5
    login-lock-ttl: 15m
    login-ip-limit-per-minute: 30
    reset-token-ttl: 5m
    code-pepper: ${WZBLOG_CODE_PEPPER}
    log-verification-code: ${WZBLOG_LOG_VERIFICATION_CODE:false}
    verification-max-attempts: 3
    register-ip-limit-per-hour: 10
    forgot-email-limit-per-hour: 5
    forgot-ip-limit-per-hour: 10
    avatar-public-base-url: ${FILE_PUBLIC_BASE_URL:http://localhost:8021/media}
  wechat:
    app-id: ${WECHAT_APP_ID:${WX_MINIAPP_APPID:}}
    app-secret: ${WECHAT_APP_SECRET:${WX_MINIAPP_SECRET:}}
    # mock=本地/测试确定性上游；real=凭据齐备后走真实微信（provider 由 env 覆盖）
    provider: ${WECHAT_PROVIDER:auto}
  ai:
    enabled: ${AI_ENABLED:true}
    provider: ${AI_PROVIDER:mock}
    base-url: ${AI_BASE_URL:https://open.bigmodel.cn/api/paas/v4}
    api-key: ${ZHIPU_API_KEY:}
    model: ${AI_MODEL:glm-4-flash-250414}
  admin:
    username: ${WZBLOG_ADMIN_USERNAME:}
    password: ${WZBLOG_ADMIN_PASSWORD:}
    email: ${WZBLOG_ADMIN_EMAIL:}