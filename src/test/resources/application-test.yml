spring:
  datasource:
    hikari:
      maximum-pool-size: 10

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

wzblog:
  auth:
    jwt-secret: test-secret-key-with-at-least-32-bytes-0123456789
    captcha-enabled: false
    login-ip-limit-per-minute: 10000
    register-ip-limit-per-hour: 10000
    forgot-email-limit-per-hour: 1000
    forgot-ip-limit-per-hour: 1000
    code-pepper: test-pepper
    log-verification-code: true
  admin:
    username: bootstrap_admin
    password: AdminPass123
    email: bootstrap@wzblog.test
  interaction:
    user-comment-short-limit: 10000
    user-comment-daily-limit: 100000
    guest-comment-short-limit: 10000
    guest-comment-daily-limit: 100000
    guestbook-short-limit: 10000
    guestbook-daily-limit: 100000
  ai:
    enabled: true
    provider: mock
    ip-minute-quota: 10000
    daily-user-quota: 10000
    guest-daily-quota: 10000
  file:
    storage: local
    root: ./target/test-uploads
    public-base-url: http://localhost:8021/media
    upload-base-url: http://localhost:8021
    url-secret: test-file-url-secret-with-at-least-32-bytes

logging:
  level:
    com.wzblog: INFO